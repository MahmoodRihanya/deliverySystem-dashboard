name: dashboard_app
description: "A professional and responsive dashboard application built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  shared_preferences: ^2.5.3
  flutter_bloc: ^9.1.1
  google_fonts: ^6.3.2
  flutter_dotenv: ^6.0.0
  equatable: ^2.0.8
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
